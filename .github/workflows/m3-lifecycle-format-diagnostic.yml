name: M3 Lifecycle Format Diagnostic

on:
  push:
    branches:
      - 'feat/m3-runtime-lifecycle-events'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format lifecycle slice
        run: pnpm exec prettier --write apps/desktop/src/renderer/components/ProjectWorkspace.tsx apps/desktop/src/shared/contracts/runtime-lifecycle.ts
      - name: Print formatting diff
        run: git diff --no-color -- apps/desktop/src/renderer/components/ProjectWorkspace.tsx apps/desktop/src/shared/contracts/runtime-lifecycle.ts
