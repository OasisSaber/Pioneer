name: M2 Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: m2-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m2-quality:
    name: Windows M2 gate
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository normalization
        run: pnpm verify:repository

      - name: Run authoritative M2 gate
        run: pnpm check
