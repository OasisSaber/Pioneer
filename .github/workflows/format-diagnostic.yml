name: Format Diagnostic

on:
  push:
    branches:
      - 'fix/m2-final-gate'

permissions:
  contents: read

jobs:
  format:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture format-check output
        shell: pwsh
        run: |
          pnpm format:check *> format-output.txt
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content format-output.txt
          exit 0
      - name: Upload formatter output
        uses: actions/upload-artifact@v4
        with:
          name: prettier-check-output
          path: format-output.txt
