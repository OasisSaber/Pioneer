name: Gate Diagnostic

on:
  push:
    branches:
      - 'fix/m2-final-gate'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture lint output
        shell: pwsh
        run: |
          pnpm lint *> gate-output.txt
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content gate-output.txt
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: gate-diagnostic-output
          path: gate-output.txt
