name: Format Diagnostic

on:
  push:
    branches:
      - 'fix/m2-final-gate'

permissions:
  contents: read

jobs:
  format:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format quality-gate targets
        run: >-
          pnpm exec prettier --write
          apps/desktop
          tests/contract
          tests/e2e
          tests/helpers
          package.json
          pnpm-workspace.yaml
          eslint.config.mjs
          vitest.config.ts
      - name: Capture formatter diff
        shell: bash
        run: |
          git diff --name-only > prettier-files.txt
          git diff --no-ext-diff > prettier.diff
      - name: Upload formatter diff
        uses: actions/upload-artifact@v4
        with:
          name: prettier-diff
          path: |
            prettier-files.txt
            prettier.diff
