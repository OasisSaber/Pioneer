name: Gate Diagnostic

on:
  push:
    branches:
      - 'fix/m2-final-gate'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture all gate outputs
        shell: pwsh
        run: |
          $commands = @(
            @{ name = 'format'; command = 'pnpm format:check' },
            @{ name = 'lint'; command = 'pnpm lint' },
            @{ name = 'typecheck'; command = 'pnpm typecheck' },
            @{ name = 'contract'; command = 'pnpm test:contract' },
            @{ name = 'prototype'; command = 'pnpm test:prototype' },
            @{ name = 'e2e'; command = 'pnpm test:e2e' },
            @{ name = 'package-smoke'; command = 'pnpm package:smoke' }
          )
          foreach ($item in $commands) {
            "===== $($item.name) =====" | Add-Content gate-output.txt
            Invoke-Expression $item.command *>> gate-output.txt
            "exit_code=$LASTEXITCODE" | Add-Content gate-output.txt
            "" | Add-Content gate-output.txt
          }
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: gate-diagnostic-output
          path: gate-output.txt
