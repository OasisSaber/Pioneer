name: M3 Format Diagnostic

on:
  push:
    branches:
      - 'feat/m3-intent-vertical-slice'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M3 E2E
        run: pnpm exec prettier --write tests/e2e/m3-intent.e2e.spec.ts
      - name: Print formatting diff
        run: git diff --no-color -- tests/e2e/m3-intent.e2e.spec.ts
